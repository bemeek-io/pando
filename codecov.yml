# Coverage arrives in two uploads, and neither one is the whole picture.
#
# The unit job cannot reach the API handlers, the state store or the runtime
# adapter: those hold concrete types rather than interfaces, so a test either
# runs against real Postgres and Docker or it tests nothing. The integration
# job covers them and uploads under its own flag. Codecov takes the union, and
# every line it counts was executed by a test that ran.
#
# after_n_builds is what stops it reporting before it has both. The unit job
# finishes in about three minutes and the integration job in about eight, so
# without this every pull request gets a comment saying its coverage collapsed
# — naming the files only the integration flag covers — and then a silent
# correction once the second upload lands. That happened twice on #21 before
# this file existed, and the first number is the one people read.
codecov:
  notify:
    # Both uploads before any commit status is sent.
    after_n_builds: 2
    # And do not settle for one if the other is slow: wait.
    wait_for_ci: true

comment:
  # Same rule for the pull request comment, for the same reason.
  after_n_builds: 2
  require_changes: false

flags:
  unit:
    paths:
      - /
    carryforward: false

  # Carried forward because the integration job is the slow one and the only
  # one that can cover those packages. If a run does not produce it — a
  # cancelled job, a runner that died — the last known value stands rather than
  # the project appearing to lose a third of its coverage for a reason that has
  # nothing to do with the change.
  integration:
    paths:
      - /
    carryforward: true
