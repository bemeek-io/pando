services:
  web:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis

  worker:
    build: ./app
    command: ["python", "-u", "worker.py"]
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
