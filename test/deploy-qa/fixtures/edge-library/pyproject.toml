[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slugkit"
version = "0.3.1"
description = "Turn arbitrary strings into URL slugs."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/slugkit"]
